<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>my tasks</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #faf8f5;
  --surface: #ffffff;
  --border: #ece5dc;
  --text: #352e27;
  --muted: #b0a090;
  --accent: #c9a96e;
  --lavender: #ddd6f3;
  --lav-dark: #6b5fa0;
  --mint: #c9e8d5;
  --mint-dark: #3a7a5a;
  --pink: #f5d0d8;
  --pink-dark: #a05068;
}
html, body { height: 100%; margin: 0; }
body { font-family: 'Avenir Next', 'Avenir', 'Century Gothic', sans-serif; background: var(--bg); color: var(--text); display: flex; }

.sidebar { width: 250px; background: var(--surface); border-right: 1px solid var(--border); padding: 1.5rem 1rem; overflow-y: auto; transition: all 0.3s; }
.sidebar.collapsed { width: 60px; padding: 1rem 0.5rem; }
.sidebar.collapsed .nav-text { display: none; }

.sidebar-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; }
.toggle-btn { background: none; border: none; cursor: pointer; font-size: 18px; color: var(--text); padding: 4px; }

.nav-menu { display: flex; flex-direction: column; gap: 8px; }
.nav-item { padding: 10px 12px; border-radius: 10px; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 13px; font-weight: 500; }
.nav-item:hover { background: var(--bg); color: var(--text); }
.nav-item.active { background: var(--lavender); color: var(--lav-dark); border: 1px solid var(--lav-dark); }
.nav-text { flex: 1; }

.main-content { flex: 1; display: flex; flex-direction: column; }
.header { padding: 1.5rem 2rem; border-bottom: 1px solid var(--border); background: var(--surface); display: flex; align-items: center; justify-content: space-between; }
.header-title { font-size: 28px; font-weight: 600; }
.settings-btn { padding: 6px 12px; background: transparent; border: 1px solid var(--border); border-radius: 30px; cursor: pointer; font-size: 16px; color: var(--text); }
.settings-btn:hover { background: var(--border); }

.content { flex: 1; overflow-y: auto; padding: 2rem; }

.summary { display: flex; gap: 8px; margin-bottom: 1.5rem; }
.stat-card { flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; }
.stat-label { font-size: 10px; color: var(--muted); margin-bottom: 3px; text-transform: uppercase; }
.stat-num { font-size: 28px; font-weight: 600; color: var(--text); }
.stat-num.s-prog { color: var(--lav-dark); }
.stat-num.s-done { color: var(--mint-dark); }

.filter-row { display: flex; gap: 6px; margin-bottom: 1.5rem; }
.add-btn { margin-left: auto; padding: 7px 16px; font-size: 12px; border: 1px solid var(--border); border-radius: 30px; background: var(--surface); cursor: pointer; color: var(--text); font-weight: 500; transition: all 0.2s; }
.add-btn:hover { background: var(--text); color: var(--bg); }

.priority-section { margin-bottom: 2rem; }
.priority-title { font-size: 18px; font-weight: 600; color: var(--text); margin-bottom: 1rem; }
.priority-item { display: flex; align-items: center; gap: 12px; padding: 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 8px; cursor: pointer; transition: all 0.2s; }
.priority-item:hover { border-color: var(--accent); }
.priority-num { font-size: 24px; font-weight: 600; color: var(--accent); min-width: 30px; }
.priority-content { flex: 1; }
.priority-name { font-size: 14px; font-weight: 500; color: var(--text); margin-bottom: 4px; }
.priority-due { font-size: 11px; color: var(--muted); }
.priority-check { padding: 6px 10px; font-size: 12px; background: transparent; border: 1px solid var(--border); border-radius: 6px; cursor: pointer; color: var(--muted); }

.projects-view { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; }
.project-column { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 1.25rem; max-height: 70vh; overflow-y: auto; }
.project-header { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 1rem; display: flex; align-items: center; gap: 6px; }
.project-color { width: 12px; height: 12px; border-radius: 3px; }
.project-tasks { display: flex; flex-direction: column; gap: 8px; }

.task-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px; margin-bottom: 6px; transition: all 0.2s; }
.task-card:hover { box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
.task-title { font-size: 13px; font-weight: 500; color: var(--text); margin-bottom: 6px; }
.task-title.done { text-decoration: line-through; color: var(--muted); }
.task-meta { display: flex; gap: 6px; font-size: 11px; color: var(--muted); margin-bottom: 6px; }
.task-actions { display: flex; gap: 4px; }
.task-btn { padding: 3px 8px; font-size: 10px; background: transparent; border: 1px solid var(--border); border-radius: 6px; cursor: pointer; color: var(--muted); transition: all 0.15s; }
.task-btn:hover { background: var(--bg); color: var(--text); }
.task-btn.delete:hover { color: var(--pink-dark); border-color: var(--pink); }

.calendar-nav { display: flex; gap: 8px; align-items: center; margin-bottom: 1.5rem; justify-content: space-between; }
.calendar-btn { padding: 5px 14px; font-size: 12px; border: 1px solid var(--border); border-radius: 30px; background: var(--surface); cursor: pointer; color: var(--muted); }
.calendar-btn:hover { background: var(--text); color: var(--bg); }
.calendar-month { font-size: 16px; font-weight: 500; color: var(--text); flex: 1; text-align: center; }

.week-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; }
.day-col { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px; min-height: 200px; overflow-y: auto; }
.day-col.today { border-color: var(--accent); background: #fffbf4; }
.day-header { font-size: 11px; color: var(--muted); text-align: center; margin-bottom: 6px; font-weight: 500; text-transform: uppercase; }
.day-num { font-size: 16px; font-weight: 600; text-align: center; color: var(--text); margin-bottom: 8px; }
.day-tasks { display: flex; flex-direction: column; gap: 4px; }
.day-task { font-size: 10px; padding: 4px 6px; background: var(--lavender); color: var(--lav-dark); border-radius: 4px; cursor: pointer; }
.day-task.done { background: transparent; color: var(--muted); text-decoration: line-through; border: 1px solid var(--muted); }

.month-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.month-cell { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 6px; min-height: 60px; overflow-y: auto; font-size: 11px; }
.month-cell.today { border-color: var(--accent); background: #fffbf4; }
.month-cell.other { opacity: 0.4; }
.month-date { font-weight: 600; color: var(--text); margin-bottom: 3px; }
.month-task { padding: 2px 3px; background: var(--lavender); color: var(--lav-dark); border-radius: 2px; font-size: 9px; margin-bottom: 1px; cursor: pointer; }
.month-task.done { background: transparent; color: var(--muted); text-decoration: line-through; border: 1px solid var(--muted); }

.empty-state { text-align: center; padding: 2rem; color: var(--muted); font-style: italic; }

.modal-bg { display: none; position: fixed; inset: 0; z-index: 100; align-items: center; justify-content: center; }
.modal-bg.open { display: flex; }
.modal-backdrop { position: absolute; inset: 0; background: rgba(250, 248, 245, 0.6); backdrop-filter: blur(8px); }
.modal { position: relative; z-index: 1; background: var(--surface); border-radius: 22px; border: 1px solid var(--border); padding: 1.75rem; width: 380px; max-width: 90vw; max-height: 80vh; overflow-y: auto; box-shadow: 0 8px 40px rgba(53, 46, 39, 0.1); }
.modal h2 { font-size: 24px; font-weight: 600; color: var(--text); margin-bottom: 1.25rem; }
.form-group { margin-bottom: 14px; }
.form-group label { font-size: 10px; color: var(--muted); display: block; margin-bottom: 5px; text-transform: uppercase; font-weight: 500; }
.form-group input, .form-group select, .form-group textarea { width: 100%; font-size: 13px; font-family: inherit; border: 1px solid var(--border); border-radius: 10px; padding: 9px 12px; background: var(--bg); color: var(--text); outline: none; }
.form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--accent); }
.form-group textarea { resize: vertical; min-height: 60px; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 1.5rem; }
.btn-cancel { padding: 8px 18px; font-size: 13px; border: 1px solid var(--border); border-radius: 30px; background: transparent; cursor: pointer; color: var(--muted); }
.btn-save { padding: 8px 22px; font-size: 13px; border: none; border-radius: 30px; background: var(--text); cursor: pointer; color: var(--bg); font-weight: 500; }
.btn-save:hover { background: #5a4a3a; }

.categories-list { margin: 1rem 0; }
.category-item { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: var(--bg); border-radius: 10px; margin-bottom: 6px; justify-content: space-between; }
.category-color { width: 16px; height: 16px; border-radius: 4px; cursor: pointer; }
.category-name { flex: 1; font-size: 13px; color: var(--text); font-weight: 500; }
.category-btn { padding: 4px 8px; font-size: 11px; background: transparent; border: 1px solid var(--border); border-radius: 6px; cursor: pointer; color: var(--muted); }
.category-btn:hover { background: var(--border); color: var(--text); }
.category-btn.delete:hover { border-color: var(--pink); color: var(--pink-dark); }

.new-category-input { display: flex; gap: 6px; margin-top: 8px; }
.new-category-input input { flex: 1; padding: 6px 10px; font-size: 12px; border: 1px solid var(--border); border-radius: 6px; }
.new-category-input button { padding: 6px 12px; font-size: 12px; background: var(--text); color: var(--bg); border: none; border-radius: 6px; cursor: pointer; font-weight: 500; }

@media(max-width: 768px) {
  body { flex-direction: column; }
  .sidebar { width: 100%; border-right: none; border-bottom: 1px solid var(--border); }
  .sidebar.collapsed { width: 100%; }
  .sidebar.collapsed .nav-text { display: inline; }
}
</style>
</head>
<body>

<div class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <div style="font-size: 20px; font-weight: 600; color: var(--accent);">my</div>
    <button class="toggle-btn" onclick="toggleSidebar()" title="Toggle">≡</button>
  </div>
  <nav class="nav-menu">
    <div class="nav-item active" onclick="switchView('dashboard')">
      <span class="nav-text">Dashboard</span>
    </div>
    <div class="nav-item" onclick="switchView('projects')">
      <span class="nav-text">Projects</span>
    </div>
    <div class="nav-item" onclick="switchView('weekly')">
      <span class="nav-text">Weekly</span>
    </div>
    <div class="nav-item" onclick="switchView('monthly')">
      <span class="nav-text">Monthly</span>
    </div>
  </nav>
</div>

<div class="main-content">
  <div class="header">
    <div class="header-title" id="page-title">Dashboard</div>
    <button class="settings-btn" onclick="openSettings()" title="Settings">⚙</button>
  </div>
  <div class="content" id="content"></div>
</div>

<div class="modal-bg" id="modal">
  <div class="modal-backdrop" onclick="closeModal()"></div>
  <div class="modal">
    <h2 id="modal-title">Add Task</h2>
    <div class="form-group">
      <label>Title</label>
      <input type="text" id="f-title" placeholder="Task title">
    </div>
    <div class="form-group">
      <label>Due Date</label>
      <input type="date" id="f-date">
    </div>
    <div class="form-group">
      <label>Category</label>
      <select id="f-category"><option value="">None</option></select>
    </div>
    <div class="form-group">
      <label>Status</label>
      <select id="f-status">
        <option value="on progress">On Progress</option>
        <option value="done">Done</option>
      </select>
    </div>
    <div class="form-group">
      <label>Notes</label>
      <textarea id="f-note" placeholder="Add notes..."></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save" onclick="saveTask()">Save</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="settings-modal">
  <div class="modal-backdrop" onclick="closeSettings()"></div>
  <div class="modal">
    <h2>Settings & Categories</h2>
    <h3 style="font-size:14px;margin:1.5rem 0 1rem;color:var(--text);font-weight:600">Manage Categories</h3>
    <div class="categories-list" id="categories-list"></div>
    <div style="margin:1.5rem 0 0;padding-top:1rem;border-top:1px solid var(--border)">
      <label style="font-size:10px;color:var(--muted);display:block;margin-bottom:8px;text-transform:uppercase;font-weight:500">Add New Category</label>
      <div class="new-category-input">
        <input type="text" id="new-category-input" placeholder="Category name">
        <button onclick="addCategory()">Add</button>
      </div>
    </div>
    <div class="modal-actions" style="margin-top:1.5rem">
      <button class="btn-cancel" onclick="closeSettings()">Close</button>
    </div>
  </div>
</div>

<script>
const DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const MONTHS_S=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DEFAULT_COLORS=['#FF6B6B','#4ECDC4','#45B7D1','#FFA07A','#98D8C8','#F7DC6F','#BB8FCE','#85C1E2'];

let tasks=[],categories=[],view='dashboard',editId=null,navDate=new Date(),sidebarCollapsed=false;

function load(){
  const stored=localStorage.getItem('mytasks');
  const catStored=localStorage.getItem('categories');
  tasks=stored?JSON.parse(stored):[
    {id:'1',title:'Design dashboard UI',date:'2025-05-10',category:'Work',status:'on progress',note:''},
    {id:'2',title:'Review code',date:'2025-05-08',category:'Work',status:'on progress',note:''},
    {id:'3',title:'Grocery shopping',date:'2025-05-07',category:'Shopping',status:'done',note:''},
    {id:'4',title:'Update portfolio',date:'2025-05-15',category:'Personal',status:'on progress',note:''}
  ];
  categories=catStored?JSON.parse(catStored):[
    {name:'Work',color:'#4ECDC4'},{name:'Personal',color:'#FF6B6B'},{name:'Health',color:'#45B7D1'},{name:'Shopping',color:'#FFA07A'}
  ];
}

function save(){
  localStorage.setItem('mytasks',JSON.stringify(tasks));
  localStorage.setItem('categories',JSON.stringify(categories));
}

function toggleSidebar(){
  sidebarCollapsed=!sidebarCollapsed;
  document.getElementById('sidebar').classList.toggle('collapsed');
}

function switchView(v){
  view=v;navDate=new Date();
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.remove('active'));
  event.target.closest('.nav-item').classList.add('active');
  const titles={dashboard:'Dashboard',projects:'Projects',weekly:'Weekly',monthly:'Monthly'};
  document.getElementById('page-title').textContent=titles[v];
  render();
}

function getCategoryColor(name){
  const cat=categories.find(c=>c.name===name);
  return cat?cat.color:'#ccc';
}

function updateCategorySelect(){
  const sel=document.getElementById('f-category');
  sel.innerHTML='<option value="">None</option>';
  categories.forEach(c=>{const o=document.createElement('option');o.value=c.name;o.textContent=c.name;sel.appendChild(o);});
}

function openModal(id){
  editId=id||null;updateCategorySelect();
  if(id){
    const t=tasks.find(x=>x.id===id);
    document.getElementById('f-title').value=t.title;
    document.getElementById('f-date').value=t.date;
    document.getElementById('f-category').value=t.category||'';
    document.getElementById('f-status').value=t.status;
    document.getElementById('f-note').value=t.note||'';
    document.getElementById('modal-title').textContent='Edit Task';
  }else{
    document.getElementById('f-title').value='';
    document.getElementById('f-date').value=new Date().toISOString().slice(0,10);
    document.getElementById('f-category').value='';
    document.getElementById('f-status').value='on progress';
    document.getElementById('f-note').value='';
    document.getElementById('modal-title').textContent='Add Task';
  }
  document.getElementById('modal').classList.add('open');
  setTimeout(()=>document.getElementById('f-title').focus(),60);
}

function closeModal(){document.getElementById('modal').classList.remove('open')}
function openSettings(){renderCategories();document.getElementById('settings-modal').classList.add('open')}
function closeSettings(){document.getElementById('settings-modal').classList.remove('open')}

function renderCategories(){
  const list=document.getElementById('categories-list');
  list.innerHTML=categories.map((c,i)=>`<div class="category-item"><div class="category-color" style="background:${c.color}" onclick="changeCategoryColor(${i})"></div><div class="category-name">${c.name}</div><button class="category-btn delete" onclick="deleteCategory(${i})">x</button></div>`).join('');
}

function addCategory(){
  const inp=document.getElementById('new-category-input');
  const n=inp.value.trim();
  if(!n){alert('Enter name');return}
  if(categories.find(c=>c.name===n)){alert('Exists');return}
  categories.push({name:n,color:DEFAULT_COLORS[categories.length%DEFAULT_COLORS.length]});
  save();inp.value='';renderCategories();updateCategorySelect();
}

function deleteCategory(i){
  if(!confirm('Delete?'))return;
  const n=categories[i].name;
  tasks=tasks.map(t=>t.category===n?{...t,category:''}:t);
  categories.splice(i,1);
  save();renderCategories();updateCategorySelect();render();
}

function changeCategoryColor(i){
  const ci=DEFAULT_COLORS.indexOf(categories[i].color);
  categories[i].color=DEFAULT_COLORS[(ci+1)%DEFAULT_COLORS.length];
  save();renderCategories();
}

function saveTask(){
  const t=document.getElementById('f-title').value.trim();
  if(!t){alert('Title required');return}
  if(editId){
    const tk=tasks.find(x=>x.id===editId);
    tk.title=t;tk.date=document.getElementById('f-date').value;tk.category=document.getElementById('f-category').value||'';
    tk.status=document.getElementById('f-status').value;tk.note=document.getElementById('f-note').value.trim();
  }else{
    tasks.push({id:Date.now()+'',title:t,date:document.getElementById('f-date').value,category:document.getElementById('f-category').value||'',status:document.getElementById('f-status').value,note:document.getElementById('f-note').value.trim()});
  }
  save();closeModal();render();
}

function deleteTask(id){if(confirm('Delete?')){tasks=tasks.filter(t=>t.id!==id);save();render()}}
function toggleStatus(id){const t=tasks.find(x=>x.id===id);if(t){t.status=t.status==='done'?'on progress':'done';save();render()}}

function getTasksByCategory(){
  const g={};categories.forEach(c=>g[c.name]=[]);g['Uncategorized']=[];
  tasks.forEach(t=>{if(t.category&&g[t.category])g[t.category].push(t);else g['Uncategorized'].push(t)});
  return g;
}

function fmt(d){if(!d)return'';const[y,m,da]=d.split('-');return`${da} ${MONTHS_S[+m-1]}`}
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function render(){
  const el=document.getElementById('content');
  const tot=tasks.length,dn=tasks.filter(t=>t.status==='done').length,pg=tasks.filter(t=>t.status==='on progress').length;
  let sm=`<div class="summary"><div class="stat-card"><div class="stat-label">Total</div><div class="stat-num">${tot}</div></div><div class="stat-card"><div class="stat-label">On Progress</div><div class="stat-num s-prog">${pg}</div></div><div class="stat-card"><div class="stat-label">Done</div><div class="stat-num s-done">${dn}</div></div></div>`;
  if(view==='dashboard')el.innerHTML=sm+renderDashboard();
  else if(view==='projects')el.innerHTML=sm+renderProjects();
  else if(view==='weekly')el.innerHTML=sm+renderWeekly();
  else el.innerHTML=sm+renderMonthly();
}

function renderDashboard(){
  const tp=tasks.filter(t=>t.status==='on progress').sort((a,b)=>new Date(a.date)-new Date(b.date)).slice(0,3);
  let h=`<div class="filter-row"><button class="add-btn" onclick="openModal()">+ New Task</button></div><div class="priority-section"><div class="priority-title">Top Priority</div>`;
  if(tp.length===0)h+=`<div class="empty-state">No active tasks</div>`;
  else tp.forEach((t,i)=>{h+=`<div class="priority-item" onclick="openModal('${t.id}')"><div class="priority-num">${i+1}</div><div class="priority-content"><div class="priority-name">${esc(t.title)}</div><div class="priority-due">Due: ${fmt(t.date)}</div></div><button class="priority-check" onclick="event.stopPropagation();toggleStatus('${t.id}')">✓</button></div>`;});
  h+=`</div>`;return h;
}

function renderProjects(){
  const g=getTasksByCategory();
  let h=`<div class="filter-row"><button class="add-btn" onclick="openModal()">+ New Task</button></div><div class="projects-view">`;
  Object.entries(g).forEach(([c,items])=>{
    if(items.length===0)return;const col=c==='Uncategorized'?'#ccc':getCategoryColor(c);
    h+=`<div class="project-column"><div class="project-header"><div class="project-color" style="background:${col}"></div>${c}</div><div class="project-tasks">`;
    items.forEach(t=>{h+=`<div class="task-card"><div class="task-title ${t.status==='done'?'done':''}">${esc(t.title)}</div><div class="task-meta">${fmt(t.date)}</div><div class="task-actions"><button class="task-btn" onclick="toggleStatus('${t.id}')">${t.status==='done'?'Reopen':'Done'}</button><button class="task-btn" onclick="openModal('${t.id}')">Edit</button><button class="task-btn delete" onclick="deleteTask('${t.id}')">Delete</button></div></div>`;});
    h+=`</div></div>`;
  });
  h+=`</div>`;return h;
}

function renderWeekly(){
  const b=new Date(navDate),dw=b.getDay();const m=new Date(b);m.setDate(b.getDate()-dw);
  const tdy=new Date().toISOString().slice(0,10);const s=m.toISOString().slice(0,10);const e=new Date(m.getTime()+6*86400000).toISOString().slice(0,10);
  let h=`<div class="calendar-nav"><button class="calendar-btn" onclick="navDate.setDate(navDate.getDate()-7);render()">Prev</button><div class="calendar-month">${fmt(s)} - ${fmt(e)}</div><button class="calendar-btn" onclick="navDate.setDate(navDate.getDate()+7);render()">Next</button></div><div class="filter-row"><button class="add-btn" onclick="openModal()">+ New Task</button></div><div class="week-grid">`;
  for(let i=0;i<7;i++){const d=new Date(m.getTime()+i*86400000);const ds=d.toISOString().slice(0,10);const isTd=ds===tdy;const dt=tasks.filter(t=>t.date===ds);h+=`<div class="day-col ${isTd?'today':''}"><div class="day-header">${DAYS[d.getDay()]}</div><div class="day-num">${d.getDate()}</div><div class="day-tasks">`;dt.forEach(t=>{h+=`<div class="day-task ${t.status==='done'?'done':''}" onclick="openModal('${t.id}')" title="${esc(t.title)}">${esc(t.title)}</div>`});h+=`</div></div>`;}
  h+=`</div>`;return h;
}

function renderMonthly(){
  const y=navDate.getFullYear(),mo=navDate.getMonth();const tdy=new Date().toISOString().slice(0,10);const fd=new Date(y,mo,1).getDay();const dm=new Date(y,mo+1,0).getDate();
  let h=`<div class="calendar-nav"><button class="calendar-btn" onclick="navDate.setMonth(navDate.getMonth()-1);render()">Prev</button><div class="calendar-month">${MONTHS[mo]} ${y}</div><button class="calendar-btn" onclick="navDate.setMonth(navDate.getMonth()+1);render()">Next</button></div><div class="filter-row"><button class="add-btn" onclick="openModal()">+ New Task</button></div><div class="month-grid">`;
  DAYS.forEach(d=>{h+=`<div style="text-align:center;font-size:11px;font-weight:600;color:var(--muted);padding:6px 0">${d}</div>`});
  for(let i=0;i<fd;i++)h+=`<div class="month-cell other"></div>`;
  for(let d=1;d<=dm;d++){const ds=`${y}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;const isTd=ds===tdy;const dt=tasks.filter(t=>t.date===ds);h+=`<div class="month-cell ${isTd?'today':''}"><div class="month-date">${d}</div>`;dt.forEach(t=>{h+=`<div class="month-task ${t.status==='done'?'done':''}" onclick="openModal('${t.id}')" title="${esc(t.title)}">${esc(t.title)}</div>`});h+=`</div>`;}
  h+=`</div>`;return h;
}

document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeSettings()}});

load();
render();
</script>
